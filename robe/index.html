<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
  <script>
    // Filtre anti-tremblement centré sur le GIF :
    // - on lisse la position du CENTRE du GIF (pas du coin de l'image),
    //   donc pas de décalage quand on est loin ;
    // - lissage adaptatif : fort sur les petits tremblements, rapide sur les vrais
    //   mouvements, et il rattrape toujours la bonne position (aucun écart résiduel).
    AFRAME.registerComponent('stabilise', {
      schema: {
        cible:    { type: 'selector' },
        decalage: { type: 'vec3', default: { x: 0, y: 0, z: 0 } },  // centre du GIF dans le repère de l'image
        rotation: { type: 'vec3', default: { x: 0, y: 0, z: 0 } }   // orientation du GIF (degrés)
      },
      init() {
        this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
        this.m = new THREE.Matrix4(); this.off = new THREE.Matrix4();
        const d = this.data, r = THREE.MathUtils.degToRad;
        this.off.compose(new THREE.Vector3(d.decalage.x, d.decalage.y, d.decalage.z),
                         new THREE.Quaternion().setFromEuler(new THREE.Euler(r(d.rotation.x), r(d.rotation.y), r(d.rotation.z))),
                         new THREE.Vector3(1, 1, 1));
        this.pret = false; this.vu = false;
        this.el.object3D.visible = false;
        this.data.cible.addEventListener('markerFound', () => { this.vu = true; });
        this.data.cible.addEventListener('markerLost',  () => { this.vu = false; this.pret = false; });
      },
      tick() {
        const t = this.data.cible.object3D, o = this.el.object3D;
        if (!this.vu && !t.visible) { o.visible = false; return; }
        t.updateMatrixWorld(true);
        this.m.multiplyMatrices(t.matrixWorld, this.off);   // pose du centre du GIF
        this.m.decompose(this.p, this.q, this.s);
        o.visible = true;
        if (!this.pret) {
          o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s);
          this.pret = true; return;
        }
        const rel = o.position.distanceTo(this.p) / (this.p.length() || 1);  // écart relatif à la distance
        const deg = o.quaternion.angleTo(this.q) * 180 / Math.PI;
        const clamp = (v) => Math.min(0.6, Math.max(0.08, v));
        o.position.lerp(this.p, clamp(0.08 + rel * 10));
        o.quaternion.slerp(this.q, clamp(0.08 + deg * 0.05));
        o.scale.copy(this.s);
      }
    });
  </script>
  <style>
    .arjs-loader {
      height: 100%; width: 100%; position: absolute; top: 0; left: 0;
      background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    .arjs-loader div { text-align: center; font-size: 1.25em; color: white; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">
  <div class="arjs-loader"><div>Loading, please wait...</div></div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video id="gif" src="assets/robe_rose.mp4" preload="auto" autoplay loop muted
             playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <!-- url = chemin vers a.fset / a.fset3 / a.iset, SANS extension -->
    <a-nft id="marqueur" type="nft" url="https://lena-mrn12.github.io/TD7_GPS/robe/assets/panneau"
      smooth="true" smoothCount="15" smoothTolerance=".01" smoothThreshold="5">
    </a-nft>

    <!-- le GIF suit le marqueur via le filtre anti-tremblement -->
    <a-entity stabilise="cible: #marqueur; decalage: 175 0 -199; rotation: -90 0 0">
        <!-- le GIF (converti en vidéo) posé à plat sur le panneau -->
        <a-video src="#gif"
          width="360" height="320">
        </a-video>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Les téléphones bloquent parfois la lecture automatique :
    // on relance la vidéo quand l'image est détectée ou quand on touche l'écran.
    const vid = document.querySelector('#gif');
    const lancer = () => vid.play().catch(() => {});
    window.addEventListener('click', lancer);
    window.addEventListener('touchstart', lancer);
    document.querySelector('a-nft').addEventListener('markerFound', lancer);
  </script>
</body>
</html>
